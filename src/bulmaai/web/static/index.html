<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BulmaAI Panel</title>
  <link rel="stylesheet" href="/static/panel.css">
  <!-- panel.js first; nav order comes from NAV in panel.js. moderation.js before logs.js (Panel.caseColumns),
       cardeditor.js before announce/templates (Panel.cardEditor). -->
  <script defer src="/static/panel.js"></script>
  <script defer src="/static/status.js"></script>
  <script defer src="/static/moderation.js"></script>
  <script defer src="/static/logs.js"></script>
  <script defer src="/static/dashboard.js"></script>
  <script defer src="/static/automod.js"></script>
  <script defer src="/static/tickets.js"></script>
  <script defer src="/static/cardeditor.js"></script>
  <script defer src="/static/announce.js"></script>
  <script defer src="/static/templates.js"></script>
  <script defer src="/static/patreon.js"></script>
  <script defer src="/static/settings.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <h1>BulmaAI Panel</h1>
      <p class="muted" data-i18n="DragonMineZ staff only.">DragonMineZ staff only.</p>
      <form action="/auth/login" method="get" class="stack">
        <label class="row"><input type="checkbox" name="remember" value="1" checked> <span data-i18n="Remember me for 30 days">Remember me for 30 days</span></label>
        <button class="btn primary" type="submit" data-i18n="Log in with Discord">Log in with Discord</button>
      </form>
    </div>
  </div>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="menu-toggle" class="btn ghost menu-toggle" type="button" aria-label="Menu" data-i18n-label="Menu" aria-expanded="false" aria-controls="sidebar"><span aria-hidden="true">&#9776;</span></button>
      <span id="topbar-guild">BulmaAI</span>
    </header>
    <div id="backdrop" class="backdrop" hidden></div>
    <aside id="sidebar" class="sidebar">
      <div class="brand"><img id="guild-icon" alt=""><span id="guild-name">BulmaAI</span></div>
      <nav id="nav"></nav>
      <div class="me">
        <img id="me-avatar" alt="">
        <div><div id="me-name"></div><div id="me-tier" class="muted small"></div></div>
        <button id="logout" class="btn ghost small" type="button" data-i18n="Log out">Log out</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
