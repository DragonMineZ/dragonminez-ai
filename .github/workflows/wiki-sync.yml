name: Wiki Knowledge Sync

on:
  # Fired by the gollum workflow in DragonMineZ/dragonminez (see docs/wiki-sync.md).
  repository_dispatch:
    types: [wiki-updated]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the sync plan without applying it"
        type: boolean
        default: false
  schedule:
    # Weekly fallback in case a dispatch is missed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Sync wiki into vector store
        env:
          PYTHONPATH: "src"
          DISCORD_TOKEN: "dummy"
          GH_APP_PRIVATE_KEY_PEM: "dummy"
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/sync_wiki_knowledge.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
